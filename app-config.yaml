# -------------------------------------------------------------------
# CONFIGURATION DE BASE DE TON APPLICATION BACKSTAGE
# -------------------------------------------------------------------
app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

organization:
  name: My Company

# -------------------------------------------------------------------
# BACKEND CONFIG – POSTGRESQL
# -------------------------------------------------------------------
backend:
  baseUrl: http://localhost:7007

  listen:
    host: 0.0.0.0
    port: 7007

  csp:
    connect-src: ["'self'", 'http:', 'https:']

  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  database:
    client: pg
    connection:
      host: postgres
      port: 5432
      user: backstage
      password: backstage
      database: backstage

# -------------------------------------------------------------------
# INTEGRATIONS GITHUB  ✅ MUST BE TOP-LEVEL
# -------------------------------------------------------------------
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

# -------------------------------------------------------------------
# AUTH – GUEST MODE
# -------------------------------------------------------------------
auth:
  providers:
    guest: {}

# -------------------------------------------------------------------
# PROXY
# -------------------------------------------------------------------
proxy: {}

# -------------------------------------------------------------------
# TECHDOCS
# -------------------------------------------------------------------
techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local

# -------------------------------------------------------------------
# SCAFFOLDER
# -------------------------------------------------------------------
scaffolder: {}

# -------------------------------------------------------------------
# CATALOG
# -------------------------------------------------------------------
catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow: [Component, System, API, Resource, Location]

  locations:
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

# -------------------------------------------------------------------
# PERMISSIONS
# -------------------------------------------------------------------
permission:
  enabled: true

# -------------------------------------------------------------------
# KUBERNETES
# -------------------------------------------------------------------
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: aks-k8srnddevops-dev-eu1-001
          url: https://aks-k8srnddevops-dev-eu1-001.privatelink.westeurope.azmk8s.io:443
          authProvider: azure
          skipTLSVerify: true
          skipMetricsLookup: true
